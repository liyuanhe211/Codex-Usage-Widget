<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usage Rings</title>
  <style>
    :root { color-scheme: light dark; --surface:#ffffff; --text:#24272d; --muted:#707783; --line:#e5e8ed; --hover:#f3f5f8; }
    @media (prefers-color-scheme:dark) { :root { --surface:#202124; --text:#eceef2; --muted:#a2a7b2; --line:#363940; --hover:#2a2d33; } }
    :root[data-theme="light"] { --surface:#ffffff; --text:#24272d; --muted:#707783; --line:#e5e8ed; --hover:#f3f5f8; }
    :root[data-theme="dark"] { --surface:#202124; --text:#eceef2; --muted:#a2a7b2; --line:#363940; --hover:#2a2d33; }
    * { box-sizing:border-box; }
    body { margin:0; padding:20px; color:var(--text); background:transparent; font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif; }
    main { max-width:440px; margin:0 auto; }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
    h1 { margin:0; font-size:15px; font-weight:600; }
    button { cursor:pointer; background:var(--hover); color:var(--text); border:1px solid var(--line); border-radius:7px; padding:5px 10px; font:inherit; }
    button:disabled { cursor:wait; opacity:.6; }
    button:focus-visible, .ring-button:focus-visible, input:focus-visible { outline:2px solid #4797ed; outline-offset:3px; }
    .summary { display:flex; align-items:center; gap:14px; margin:18px 0; }
    .ring-button { position:relative; flex-shrink:0; width:80px; height:80px; border:0; padding:0; background:transparent; }
    svg { display:block; width:80px; height:80px; overflow:visible; }
    circle { fill:none; stroke-width:4; stroke-linecap:butt; transition:stroke .2s,opacity .2s,stroke-dasharray .3s; }
    .quota-sector { stroke:none; transition:fill .2s,opacity .2s; }
    .summary-copy { flex:1; min-width:0; }
    .metric { display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin:5px 0; }
    .metric span { font-size:12px; color:var(--muted); }
    .metric strong { font-weight:550; font-size:15px; font-variant-numeric:tabular-nums; }
    .description { font-size:12px; color:var(--muted); margin:0; }
    .details { border-top:1px solid var(--line); padding-top:14px; }
    .detail { display:flex; justify-content:space-between; gap:12px; padding:4px 0; }
    .detail span:last-child { font-variant-numeric:tabular-nums; text-align:right; }
    .detail small { display:block; color:var(--muted); font-size:11px; }
    .status { color:var(--muted); font-size:11px; margin-top:16px; overflow-wrap:anywhere; }
    .notice { color:var(--muted); font-size:12px; margin:8px 0 0; }
    .thread { font:11px/1.7 ui-monospace,monospace; overflow-wrap:anywhere; }
    .tooltip { display:none; position:absolute; top:84px; left:0; z-index:2; width:240px; padding:12px; text-align:left; border:1px solid var(--line); border-radius:9px; background:var(--surface); color:var(--text); box-shadow:0 4px 14px #0002; font-size:12px; pointer-events:none; }
    .ring-button:hover .tooltip, .ring-button:focus-visible .tooltip { display:block; }
    #binding { margin:12px 0; }
    #binding label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
    #binding input { width:100%; border:1px solid var(--line); background:var(--surface); color:var(--text); padding:8px; border-radius:7px; font:12px ui-monospace,monospace; }
    #binding button { margin-top:8px; }
    [hidden] { display:none !important; }
    @media (prefers-reduced-motion:reduce) { circle,.quota-sector { transition:none; } }
    @media (max-width:280px) { body { padding:12px; } .summary { gap:8px; } .ring-button,svg { width:64px; height:64px; } .metric strong { font-size:12px; } }
  </style>
</head>
<body>
<main>
  <header><h1>Usage Rings</h1><button type="button" id="refresh">Refresh</button></header>
  <div class="summary">
    <button type="button" class="ring-button" id="ring-button" aria-label="Show usage details" aria-expanded="true" aria-controls="details">
      <svg id="rings" viewBox="0 0 32 32" role="img" aria-label="Waiting for conversation usage">
        <circle data-ring="context" cx="16" cy="16" r="10" pathLength="100" transform="rotate(-90 16 16)" opacity="0"/>
        <path data-ring="quota" class="quota-sector" d="" opacity="0"/>
      </svg>
      <span id="tooltip" class="tooltip" role="tooltip">Waiting for usage data.</span>
    </button>
    <div class="summary-copy">
      <div class="metric"><span>Conversation context</span><strong id="context-value">—</strong></div>
      <div class="metric"><span>Account usage</span><strong id="quota-value">—</strong></div>
      <p class="description">Outer ring: context. Filled inner circle: the higher account usage limit.</p>
    </div>
  </div>
  <form id="binding" hidden>
    <label for="thread-input">Enter the current conversation ID, or ask Codex to open Usage Rings.</label>
    <input id="thread-input" autocomplete="off" placeholder="Find the conversation ID with /status" required>
    <button type="submit">View this conversation</button>
  </form>
  <div class="details" id="details">
    <div class="detail"><span>Context capacity</span><span id="context-capacity">—</span></div>
    <div class="detail" id="hourly-row" hidden><span>5-hour limit</span><span id="hourly-value">Unavailable</span></div>
    <div class="detail"><span>Weekly limit</span><span id="weekly-value">Unavailable</span></div>
  </div>
  <p id="notice" class="notice" role="status" aria-live="polite"></p>
  <div class="status"><div id="update-status">Connecting to the plugin.</div><div class="thread" id="thread-label"></div></div>
</main>
<script type="module">/*__WIDGET_BUNDLE__*/</script>
</body>
</html>
